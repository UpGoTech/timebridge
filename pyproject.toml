[project]
name = "timebridge"
authors = [
    { name = "UPGO", email = "email@example.com"}
]
description = "Connect biometric devices with Frappe ERP for attendance synchronization."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    # PyZK pull transport — import name is `zk`. Also enforced in install.before_install.
    "pyzk>=0.9",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
